<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F0;--surface:#FFFFFF;--ink:#17211D;--muted:#5C6A65;--line:#D8DFDC;
  --ok:#17805A;--warn:#B07300;--bad:#C23B22;--info:#2F6FB5;--purple:#7A4FC0;
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1512;--surface:#17211D;--ink:#E7EFEB;--muted:#9AABA4;--line:#2A3833;--ok:#3DBE8B;--warn:#E0A53A;--bad:#F0755E;--info:#6FA8E8;--purple:#B394EE}
  :root:not([data-theme="light"]) body{--brand-text:color-mix(in srgb,var(--brand) 45%,#fff)}
}
:root[data-theme="dark"]{--bg:#0E1512;--surface:#17211D;--ink:#E7EFEB;--muted:#9AABA4;--line:#2A3833;--ok:#3DBE8B;--warn:#E0A53A;--bad:#F0755E;--info:#6FA8E8;--purple:#B394EE}
:root[data-theme="dark"] body{--brand-text:color-mix(in srgb,var(--brand) 45%,#fff)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);
  --brand:#1F5C4A;--side:#16352D;--accent:#EAB92A;--brand-text:var(--brand);--soft:color-mix(in srgb,var(--brand) 10%,var(--surface))}
body[data-role="professor"]{--brand:#1F5C4A;--side:#16352D;--accent:#EAB92A}
body[data-role="aluno"]{--brand:#2A62C9;--accent:#FFC53D}
body[data-role="pais"]{--brand:#0B7F73;--accent:#F59E3B}
body[data-role="secretaria"]{--brand:#4B45A8;--side:#26254A;--accent:#A99BFF}
body[data-role="gestao"]{--brand:#0E6B8A;--side:#1B2933;--accent:#F0663A}
body[data-role="financeiro"]{--brand:#8A5A14;--side:#2E2312;--accent:#E8B94A}
h1,h2,h3{font-family:var(--display);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
small{font-size:12.5px}
[hidden]{display:none!important}

.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 28px;display:grid;gap:16px}
.login-card .logo{font:700 44px/1 var(--display);letter-spacing:.04em;color:var(--brand-text)}
.login-card form{display:grid;gap:16px}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:0}
details.demo{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
details.demo summary{cursor:pointer;font-weight:600}
details.demo code{background:var(--bg);padding:1px 6px;border-radius:4px}
label.f{display:grid;gap:6px;font-weight:500;font-size:14px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}

#root[data-layout="side"] .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#E6EFEB;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:38px;height:44px;border-radius:7px;background:#fff;padding:3px;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font:700 18px/1.1 var(--display);display:block}
.brand span{font-size:12.5px;opacity:.75}
.navi{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:9px 12px;border-radius:8px;cursor:pointer}
.navi:hover{background:#ffffff14}
.navi.on{background:#ffffff1f;box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.side nav{display:grid;gap:2px}
.who{margin-top:auto;border-top:1px solid #ffffff26;padding:14px 8px 0;font-size:14px}
.who b{display:block}
.who span{opacity:.75;font-size:13px}
.who .row{margin-top:10px}
.ghost{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.main{padding:28px clamp(16px,4vw,44px) 56px;max-width:1220px;width:100%}

#root[data-layout="top"] .topbar{background:var(--brand);color:#fff;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px clamp(16px,4vw,44px)}
#root[data-layout="top"] .topbar nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
#root[data-layout="top"] .navi{width:auto;border-radius:999px;padding:7px 15px}
#root[data-layout="top"] .navi.on{background:#fff;color:#16222B;box-shadow:none}
#root[data-layout="top"] .navi:hover:not(.on){background:#ffffff26}
.topbar .who{margin:0;border:0;padding:0;display:flex;gap:12px;align-items:center;text-align:right}
.topbar .who .row{margin:0}
.topbar .brand-mark{background:#fff;color:var(--brand)}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:30px;line-height:1.1;letter-spacing:-.01em}
.ph p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card>h2{font-size:18px;margin-bottom:12px}
.card h3{font-size:16px;margin:20px 0 10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.stack{display:grid;gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:6px 10px 10px 6px;padding:14px 16px}
.kpi span{color:var(--muted);font-size:13.5px}
.kpi strong{display:block;font:700 30px/1.15 var(--display)}
.kpi small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

function evItem(e,extra){const d=parse(e.date);
  return `<div class="item"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="when">${pad(d.getDate())}<small>${MESES[d.getMonth()].slice(0,3)}</small></div><div><div class="t">${esc(e.titulo)}</div><div class="d">${DIAS[d.getDay()]}, ${esc(destNome(e.turma))}</div></div></div><div class="row">${chip(EV_NOME[e.tipo],EV_CLS[e.tipo])}${extra||''}</div></div>`}
const proximos=n=>{const l=eventosVis().filter(e=>e.date>=HOJE).slice(0,n);return l.length?`<div class="list">${l.map(e=>evItem(e)).join('')}</div>`:empty('Nenhum evento marcado.')};
function horarioHTML(tid,soProf){
  const dias=[1,2,3,4,5];

function cellTri(p){if(!p.dist)return '<span class="muted">—</span>';const bad=p.ob/p.dist*100<minPct();return `<span class="${bad?'red':''}">${fp(p.ob)}</span>${p.dist<100?` <small class="muted">/${p.dist}</small>`:''}`}
const ABREV={'Português':'POR','Matemática':'MAT','Ciências':'CIÊN','História':'HIS','Geografia':'GEO','Inglês':'ING','Ed. Física':'EDFIS','Educação Física':'EDFIS','Artes':'ART','Desenho Geométrico':'DES','Física':'FÍS','Geometria':'GEOM','Química':'QUÍ','Redação':'RED'};
const abrev=d=>ABREV[d]||d.replace(/[^A-Za-zÀ-ú]/g,'').slice(0,3).toUpperCase();
const dc=v=>num(v)?String(r1(v)).replace('.',','):'-';
const f2=v=>v.toFixed(2).replace('.',',');
function cabecalhoHTML(){const c=DB.config.cabecalho;return `<div class="xl-head"><img class="xl-logo-img" src="${logoSrc()}" alt="${esc(escola())}"><div class="xl-inst"><b>${esc(c.razao)}</b>${c.linhas.map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`}
function graficoHTML(id){
  const W=720,H=300,L=46,R=130,Tp=14,B=34,pw=W-L-R,ph=H-Tp-B,cores=['#4285F4','#FBB03B','#E8480C'],max=120,y=v=>Tp+ph-(Math.max(0,Math.min(max,v))/max)*ph;
  let g='';
  for(let v=10;v<max;v+=20)g+=`<rect x="${L}" y="${y(v+10)}" width="${pw}" height="${y(v)-y(v+10)}" fill="#D9D9D9"/>`;
  for(let v=0;v<=max;v+=10)g+=`<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="#bbb" stroke-width="0.6"/><text x="${L-6}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#000">${v}</text>`;
  const n=DISC.length,gw=pw/n,bw=Math.min(14,gw/4);
  DISC.forEach((d,i)=>{const cx=L+gw*i+gw/2;
    [1,2,3].forEach((tr,k)=>{const v=pts(id,d,tr).res;if(num(v))g+=`<rect x="${cx-1.5*bw+k*bw}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" fill="${cores[k]}"/>`});
    g+=`<text x="${cx}" y="${H-14}" font-size="9" text-anchor="middle" fill="#000">${esc(abrev(d))}</text>`});
  g+=`<text transform="rotate(-90)" x="${-(Tp+ph/2)}" y="11" font-size="9" text-anchor="middle" fill="#000">Valores em (%)</text>`;
  g+=`<rect x="${L+pw+24}" y="${Tp+ph/2-34}" width="78" height="62" fill="#fff" stroke="#999"/>`+[1,2,3].map((tr,k)=>`<rect x="${L+pw+32}" y="${Tp+ph/2-24+k*18}" width="10" height="8" fill="${cores[k]}"/><text x="${L+pw+48}" y="${Tp+ph/2-16+k*18}" font-size="9" fill="#000">${tr}º TRI</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Percentual de rendimento do aluno nos trimestres">${g}</svg>`}
function boletimHTML(id){
  const a=A(id),t=T(a.turma),c=DB.config,ag=new Date(),hora=pad(ag.getHours())+':'+pad(ag.getMinutes())+':'+pad(ag.getSeconds());
  const linhas=DISC.map(d=>{let tf=0;
    const cel=[1,2,3].map(tr=>{const p=pts(id,d,tr),f=faltasTri(id,d,tr),rd=v=>num(v)&&v<minPct()?' class="red"':'';tf+=f;
      return `<td${rd(p.dist?p.ob:null)}>${dc(p.dist?p.ob:null)}</td><td${rd(p.rec)}>${dc(p.rec)}</td><td${rd(p.res)}>${dc(p.res)}</td><td>${f||'-'}</td>`}).join('');
    return `<tr><td class="l">${esc(d.toUpperCase())}</td>${cel}<td>-</td><td>${tf||'-'}</td></tr>`}).join('');
  const sub=['SOMA','REC','RESULT','FALTAS'].map(x=>`<th class="sub">${x}</th>`).join('');
  const tr3=f=>[1,2,3].map(n=>`<td>${f(c.trimestres.find(x=>x.n===n))}</td>`).join('');
  return `<div class="xl-sheet">${cabecalhoHTML()}<div class="xl-title">BOLETIM ESCOLAR</div>
  <div class="xl-meta"><div><div><b>ALUNO(a):</b> ${esc(a.nome.toUpperCase())}</div><div><b>SÉRIE/TURMA:</b> ${esc(t.nome.toUpperCase())}</div></div><div><div><b>ANO LETIVO:</b> ${c.ano}</div><div><b>EMITIDO EM:</b> ${fmt(HOJE)}</div></div></div>
  <table class="xl"><thead><tr><th rowspan="2">DISCIPLINAS</th><th colspan="4">1º TRIMESTRE</th><th colspan="4">2º TRIMESTRE</th><th colspan="4">3º TRIMESTRE</th><th colspan="2">RESULTADOS ACUMULADOS</th></tr><tr>${sub}${sub}${sub}<th class="sub">REC. F</th><th class="sub">T.F.</th></tr></thead><tbody>${linhas}</tbody></table>
  <table class="xl" style="min-width:0"><thead><tr><th style="width:46%">INFORMAÇÕES COMPLEMENTARES</th><th>1º TRIMESTRE</th><th>2º TRIMESTRE</th><th>3º TRIMESTRE</th></tr></thead><tbody><tr><td class="l"><b>VALOR</b></td>${tr3(()=>f2(100))}</tr><tr><td class="l"><b>MÉDIA</b></td>${tr3(()=>f2(minPct()))}</tr><tr><td class="l"><b>PERÍODO</b></td>${tr3(x=>fmt(x.ini)+' a '+fmt(x.fim))}</tr></tbody></table>
  <div class="xl-legend">Legenda: SOMA: Resultado antes da rec; REC: Recuperação; RESULT: Resultado após rec; TOTAL: Resultado final antes da rec; REC. F.: Recuperação final; RES: Resultado final após rec; T.F.: Total de faltas</div>
  <div class="xl-chart"><h4>PERCENTUAL DE RENDIMENTO DO ALUNO NOS TRIMESTRES</h4>${graficoHTML(id)}</div>
  <div class="xl-obs">Obs:</div><div class="xl-foot"><span>Emitido em: ${fmt(HOJE)} ${hora}</span><span>Página 1 de 1</span></div></div>`}

function somaAnoDisc(aId,d){let tot=0,algum=false;[1,2,3].forEach(t=>{const p=pts(aId,d,t);if(p.res!==null){tot+=p.res;algum=true}});return algum?r1(tot):null}
function historicoHTML(id){
  const a=A(id),t=T(a.turma)||{},c=DB.config,ant=(DB.historicoAnt[id]||[]).slice().sort((x,y)=>x.ano-y.ano),hoje=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const ativo=DB.turmas.some(x=>x.id===a.turma)&&!INATIVO.includes(a.situacao);
  const blocoAnt=x=>{const temTri=x.tri&&Object.keys(x.tri).length,ks=Object.keys(x.notas||{}),ds=[...DISC.filter(d=>ks.includes(d)),...ks.filter(d=>!DISC.includes(d))];
    return `<h3>${x.ano} — ${esc(x.serie)}${x.turma&&x.turma!==x.serie?' ('+esc(x.turma)+')':''}</h3><table class="xl" style="min-width:0"><thead><tr><th class="l">Disciplina</th>${temTri?'<th>1º TRIM.</th><th>2º TRIM.</th><th>3º TRIM.</th>':''}<th>TOTAL DO ANO</th></tr></thead><tbody>${ds.length?ds.map(d=>`<tr><td class="l">${esc(d.toUpperCase())}</td>${temTri?[0,1,2].map(i=>`<td>${dc((x.tri[d]||[])[i])}</td>`).join(''):''}<td><b>${dc(x.notas[d])}</b></td></tr>`).join(''):`<tr><td class="l" colspan="${temTri?5:2}">Notas não lançadas</td></tr>`}</tbody></table><p style="font-size:13px;margin:2px 0 12px">Resultado: <b>${esc(x.resultado||'')}</b>${num(x.freq)?', frequência de '+x.freq+'%':''}${x.escola?'. '+esc(x.escola):''}.</p>`};
  let atual='';
  if(ativo){let parcial=false;
    const linhas=DISC.map(d=>{let tf=0,tot=0,algum=false;const cs=[1,2,3].map(tr=>{const p=pts(id,d,tr);tf+=faltasTri(id,d,tr);if(p.res!==null){tot+=p.res;algum=true}else parcial=true;return `<td>${dc(p.res)}</td>`}).join('');return `<tr><td class="l">${esc(d.toUpperCase())}</td>${cs}<td><b>${algum?dc(r1(tot)):'-'}</b></td><td>${tf||'-'}</td></tr>`}).join('');
    atual=`<h3>${c.ano} — ${esc(t.serie||t.nome)}${t.nome&&t.nome!==t.serie?' ('+esc(t.nome)+')':''} (ano em curso)</h3><table class="xl" style="min-width:0"><thead><tr><th class="l">Disciplina</th><th>1º TRIM.</th><th>2º TRIM.</th><th>3º TRIM.</th><th>TOTAL (SOMA)</th><th>FALTAS</th></tr></thead><tbody>${linhas}</tbody></table>${parcial?'<p style="font-size:12px;margin:2px 0 10px">Há trimestres ainda sem notas: o total é parcial.</p>':''}`}
  return `<div class="doc">${cabecalhoHTML()}<h2>HISTÓRICO ESCOLAR</h2><p><b>Aluno(a):</b> ${esc(a.nome)}<br><b>Matrícula:</b> ${esc(a.matricula)} &nbsp;&nbsp; <b>Nascimento:</b> ${a.nasc?fmt(a.nasc):''}${a.situacao&&a.situacao!=='Matriculado'?'<br><b>Situação:</b> '+esc(a.situacao):''}${ativo?'<br><b>Série atual:</b> '+esc(t.nome):''}</p>${ant.map(blocoAnt).join('')}${atual}<p style="font-size:12px">O total do ano é a soma dos resultados dos três trimestres (máximo de 300 pontos), considerando a recuperação. Total mínimo no ano: ${c.notaMinAnual}.</p><p>${hoje}.</p><div style="display:flex;gap:40px;flex-wrap:wrap"><div class="sign">Secretário(a) escolar</div><div class="sign">Diretor(a)</div></div></div>`}
function calHTML(){
  if(!S.cal){const n=new Date();S.cal=[n.getFullYear(),n.getMonth()]}
  const y=S.cal[0],m=S.cal[1],first=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate(),evs=eventosVis();
  let cells=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<first;i++)cells+='<div class="cd off"></div>';
  for(let d=1;d<=nd;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d),e=evs.filter(x=>x.date===ds);
    cells+=`<div class="cd ${ds===HOJE?'today':''}"><b>${d}</b>${e.slice(0,2).map(x=>`<span class="ev ev-${x.tipo}" title="${esc(x.titulo)}">${esc(x.titulo)}</span>`).join('')}${e.length>2?`<span class="more">+${e.length-2} mais</span>`:''}</div>`}
  const list=evs.filter(x=>x.date.startsWith(y+'-'+pad(m+1)));
  return `<div class="card"><div class="cal-h"><button class="btn alt sm" data-act="calnav" data-d="-1" aria-label="Mês anterior">Anterior</button><h2>${MESES[m]} de ${y}</h2><button class="btn alt sm" data-act="calnav" data-d="1" aria-label="Próximo mês">Próximo</button></div><div class="cal">${cells}</div></div>
  <div class="card" style="margin-top:16px"><h2>Eventos do mês</h2>${list.length?`<div class="list">${list.map(e=>evItem(e,podeExcluirEvento(e)?`<button class="btn alt sm" data-act="novoEvento" data-id="${e.id}">Editar</button><button class="btn danger sm" data-act="delEvento" data-id="${e.id}">Excluir</button>`:'')).join('')}</div>`:empty('Nenhum evento neste mês.')}</div>`}
function pgCal(){
  const add=S.role==='professor'?(temFuncao(S.user,'calendario_add')?'<button class="btn" data-act="novoEvento">Adicionar prova ou trabalho</button>':''):ehStaff()?'<button class="btn" data-act="novoEvento">Novo evento</button>':(S.role==='pais'?childSwitch():'');
  const sub=S.role==='professor'?'Você pode cadastrar suas provas e trabalhos e excluir os que criou.':ehStaff()?'Provas, reuniões, feriados e prazos da escola.':'Provas, trabalhos, reuniões, feriados e prazos.';
  return head('Calendário',sub,add)+calHTML()}

const TIPOS_DECL=['Declaração de matrícula','Declaração de escolaridade','Declaração de frequência','Declaração de comparecimento','Declaração de transferência'];
function declaracaoHTML(aId,tipo,ex,numero){
  ex=ex||{};const a=A(aId),t=T(a.turma),resp=DB.responsaveis.find(r=>r.filhos.includes(aId)),hoje=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});let corpo='';
  if(tipo==='Histórico escolar')return historicoHTML(aId);
  if(tipo==='Boletim oficial')return boletimHTML(aId);
  if(tipo==='Declaração de matrícula')corpo=`<p>Declaramos, para os devidos fins, que <b>${esc(a.nome)}</b>, matrícula nº ${esc(a.matricula)}, nascido(a) em ${fmt(a.nasc)}, está regularmente matriculado(a) no <b>${esc(t.nome)}</b>, turno da ${t.turno.toLowerCase()}, no ano letivo de ${DB.config.ano}.</p>`;
  else if(tipo==='Declaração de escolaridade')corpo=`<p>Declaramos, para os devidos fins, que <b>${esc(a.nome)}</b>, matrícula nº ${esc(a.matricula)}, é aluno(a) desta instituição de ensino e está cursando regularmente o <b>${esc(t.nome)}</b>, turno da ${t.turno.toLowerCase()}, no ano letivo de ${DB.config.ano}.</p>`;
  else if(tipo==='Declaração de frequência'){const f=freq(aId);corpo=`<p>Declaramos que <b>${esc(a.nome)}</b>, matrícula nº ${esc(a.matricula)}, aluno(a) do <b>${esc(t.nome)}</b>, apresenta frequência de <b>${f.pct}%</b> no ano letivo de ${DB.config.ano}, com ${f.f} faltas e ${f.j} faltas justificadas em ${f.aulas} tempos de aula registrados.</p>`}
  else if(tipo==='Declaração de comparecimento'){
    const quem=ex.quem==='resp'?(resp?`o(a) Sr.(a) <b>${esc(resp.nome)}</b>, responsável pelo(a) aluno(a) <b>${esc(a.nome)}</b>`:`o(a) responsável pelo(a) aluno(a) <b>${esc(a.nome)}</b>`):`o(a) aluno(a) <b>${esc(a.nome)}</b>, matrícula nº ${esc(a.matricula)}, do ${esc(t.nome)}`;
    corpo=`<p>Declaramos, para os devidos fins, que ${quem} compareceu a esta instituição de ensino no dia <b>${fmt(ex.data||HOJE)}</b>${ex.ini&&ex.fim?`, no período das <b>${esc(ex.ini)}</b> às <b>${esc(ex.fim)}</b>`:''}, ${ex.motivo?'para '+esc(ex.motivo):'para tratar de assuntos escolares'}.</p>`}
  else corpo=`<p>Declaramos que foi solicitada a transferência de <b>${esc(a.nome)}</b>, matrícula nº ${esc(a.matricula)}, do <b>${esc(t.nome)}</b>. A documentação segue em análise pela secretaria escolar e será entregue ao responsável legal.</p>`;
  const num=numero?`<p style="text-align:right;font-size:12px;margin:0">Documento nº ${String(numero).padStart(4,'0')}/${DB.config.ano}</p>`:'';
  return `<div class="doc">${cabecalhoHTML()}${num}<h2>${esc(tipo.toUpperCase())}</h2>${corpo}<p>${hoje}.</p><div class="sign">Secretaria escolar</div></div>`}
const docHTML=d=>declaracaoHTML(d.aluno,d.tipo,d.extra,d.numero);
function pgDeclaracoes(){
  if(!DB.alunos.length)return head('Declarações','')+empty('Cadastre alunos para gerar declarações.');
  const t=S.f.dturma||'',al=DB.alunos.filter(a=>!t||a.turma===t),aid=al.find(x=>x.id===S.f.daluno)?S.f.daluno:(al[0]&&al[0].id),tipo=S.f.dtipo||TIPOS_DECL[0];
  const comp=tipo==='Declaração de comparecimento'?`<div class="grid g2"><label class="f">Quem compareceu${sel('id="dc-quem"',[['aluno','O(a) aluno(a)'],['resp','O responsável']],'aluno')}</label><label class="f">Data<input type="date" id="dc-data" value="${HOJE}"></label><label class="f">Início<input type="time" id="dc-ini"></label><label class="f">Término<input type="time" id="dc-fim"></label></div><label class="f">Finalidade (opcional)<input id="dc-mot" placeholder="Ex.: reunião com a coordenação"></label>`:'';
  const emit=DB.emitidos.slice().reverse().slice(0,30);

  <div class="card"><h2>Emitidas recentemente</h2>${emit.length?`<div class="list">${emit.map(e=>`<div class="item"><div><div class="t">${esc(e.tipo)}</div><div class="d">${esc(A(e.aluno).nome)}, nº ${String(e.numero).padStart(4,'0')}/${DB.config.ano}, ${fmt(e.date)}, ${esc(e.por)}</div></div><button class="btn alt sm" data-act="reabrirDecl" data-id="${e.id}">Abrir</button></div>`).join('')}</div>`:empty('Nenhuma declaração emitida.')}</div>`}

function childSwitch(){
  if(S.role!=='pais')return '';
  const r=DB.responsaveis.find(x=>x.id===S.uid);
  return `<div class="chips">${r.filhos.map(id=>`<button class="chipb ${id===alvo()?'on':''}" data-act="child" data-id="${id}">${esc(primeiro(A(id).nome))}</button>`).join('')}</div>`}

/* ================= Professor ================= */
function minhasTurmas(){return DB.turmas.filter(t=>Object.keys(DB.horario).some(k=>k.startsWith(t.id+'|')&&DB.horario[k].prof===S.uid))}
function F(){const p=prof(),mt=minhasTurmas();
  if(!S.f.turma||!DB.turmas.find(t=>t.id===S.f.turma))S.f.turma=(mt[0]||DB.turmas[0]||{id:''}).id;
  if(!p.disc.includes(S.f.disc))S.f.disc=p.disc[0];S.f.tri=S.f.tri||triAtual();return S.f}
function aulasDisponiveis(turma){
  const out=[];
  for(let i=0;i<=21;i++){const d=addDays(HOJE,-i),w=dow(d);if(w<1||w>5)continue;if(DB.eventos.some(e=>e.date===d&&e.tipo==='feriado'))continue;
    for(let k=0;k<tempos().length;k++){const h=hcell(turma,w,k);if(h&&h.prof===S.uid)out.push({d,k,disc:h.disc,key:turma+'|'+d+'|'+k})}}
  return out}
function pgProfPainel(){
  const p=prof(),h=dow(HOJE),aulas=[];
  if(h>=1&&h<=5)DB.turmas.forEach(t=>tempos().forEach((hr,k)=>{const c=hcell(t.id,h,k);if(c&&c.prof===p.id)aulas.push({hora:hr,k,disc:c.disc,t})}));
  aulas.sort((x,y)=>x.hora.localeCompare(y.hora));
  const tri=triAtual(),pend=[];

function temposDoDia(turma,data){const w=dow(data);if(w<1||w>5)return [];if(DB.eventos.some(e=>e.date===data&&e.tipo==='feriado'&&(e.turma==='all'||e.turma===turma)))return [];

function diasNaSemana(turma){const s=[];for(let d=1;d<=5;d++){if(tempos().some((x,k)=>{const h=hcell(turma,d,k);return h&&h.prof===S.uid}))s.push(DIAS[d])}return s}
function dataPadraoChamada(turma){for(let i=0;i<=60;i++){const d=addDays(HOJE,-i);if(temposDoDia(turma,d).length)return d}return HOJE}

function pgFaltas(){
  const t=S.f.ftur||'',st=S.f.fst||'pend',g={};
  for(const k in DB.chamada){const p=k.split('|'),r=DB.chamada[k];if(t&&p[0]!==t)continue;if(!inTurmaEsc(p[0]))continue;
    for(const a in r.reg){const v=r.reg[a];if(v!=='F'&&v!=='J')continue;const id=a+'|'+p[1];const x=g[id]=g[id]||{a,d:p[1],f:0,j:0,disc:[]};if(v==='F')x.f++;else x.j++;x.disc.push(r.disc)}}
  let l=Object.values(g).filter(x=>st==='pend'?x.f>0:x.f===0).sort((x,y)=>y.d.localeCompare(x.d)||A(x.a).nome.localeCompare(A(y.a).nome)).slice(0,80);

  `<div class="filters"><label>Turma${sel('data-chg="f" data-k="ftur"',[['','Todas'],...turmasEsc().map(x=>[x.id,x.nome])],t)}</label><label>Situação${sel('data-chg="f" data-k="fst"',[['pend','Faltas a justificar'],['just','Justificadas']],st)}</label></div>

  <div class="card" style="margin-top:16px"><h2>Próximos eventos</h2>${proximos(4)}</div>`}
function pgFechamentos(){
  const ts=turmasEsc();if(!ts.length)return semTurma('Fechamento de trimestre');
  const tri=S.f.ftri||triAtual(),tf=S.f.ftu||'',pf=S.f.fpr||'',set={};
  ts.forEach(t=>{if(tf&&t.id!==tf)return;Object.keys(DB.horario).forEach(k=>{if(!k.startsWith(t.id+'|'))return;const c=DB.horario[k],pr=PR(c.prof);if(pr)set[t.id+'|'+c.disc+'|'+pr.id]={t,disc:c.disc,prof:pr}})});

  const rows=todos.filter(r=>!pf||r.prof.id===pf).sort((a,b)=>a.prof.nome.localeCompare(b.prof.nome)||a.t.nome.localeCompare(b.t.nome)||a.disc.localeCompare(b.disc));
  const res=profs.map(p=>{const m=todos.filter(r=>r.prof.id===p.id);return{p,tot:m.length,fe:m.filter(r=>r.fech).length}});
  const totF=todos.filter(r=>r.fech).length;
  return head('Fechamento de trimestre','Veja quais professores já fecharam o trimestre em cada turma e disciplina.')+
  `<div class="filters"><label>Trimestre${sel('data-chg="f" data-k="ftri"',[1,2,3].map(x=>[String(x),x+'º trimestre']),String(tri))}</label><label>Turma${sel('data-chg="f" data-k="ftu"',[['','Todas'],...ts.map(t=>[t.id,t.nome])],tf)}</label><label>Professor(a)${sel('data-chg="f" data-k="fpr"',[['','Todos'],...profs.map(p=>[p.id,p.nome])],pf)}</label></div>
  <div class="grid g4" style="margin-bottom:16px">${kpi('Turmas e disciplinas',todos.length)}${kpi('Fechados',totF)}${kpi('Em aberto',todos.length-totF)}${kpi('Professores 100% fechados',res.filter(r=>r.tot&&r.fe===r.tot).length,'de '+res.length)}</div>
  <div class="grid g2"><div class="card"><h2>Por professor</h2>${res.length?res.map(r=>bar(r.p.nome,r.tot?r.fe/r.tot*100:0,100,r.fe+'/'+r.tot,r.fe===r.tot?'':r.fe?'warn':'bad')).join(''):'<p class="muted">Nenhum professor no quadro de horários.</p>'}</div>
  <div class="card"><h2>Detalhe</h2>${rows.length?`<div class="wrap"><table class="tbl" style="min-width:620px"><thead><tr><th>Professor(a)</th><th>Turma</th><th>Disciplina</th><th>Situação</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.prof.nome)}</td><td>${esc(r.t.nome)}</td><td>${esc(r.disc)}</td><td>${r.fech?chip('Fechado','ok')+`<small class="muted" style="display:block">${fmt(r.fech.data)}, ${esc(r.fech.por)}</small>`:chip('Em aberto','warn')+`<small class="muted" style="display:block">${r.n?r.dist+'/100 pontos'+(r.pend?', '+r.pend+' nota(s) pendente(s)':''):'sem avaliações'}</small>`}</td><td>${r.fech&&temFuncao(S.user,'reabrirtri')?`<button class="btn danger sm" data-act="reabrirTri" data-k="${r.k}">Reabrir</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum registro.')}</div></div>`}

function render(){

  if(mainEl&&root.dataset.navkey===nk&&root.dataset.layout===layout){mainEl.innerHTML=page;root.querySelectorAll('.navi').forEach(b=>{const on=b.dataset.p===S.page;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});return}
  const sc=root.querySelector('.side'),st=sc?sc.scrollTop:0;

const FORMAS=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Boleto','Outro'];
const TIPOS_COB=['Mensalidade','Matrícula','Material didático','Uniforme','Evento','Outros'];
const podeFin=k=>S.role!=='financeiro'||temFuncao(S.user,k);
const diffDias=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const cobStatus=c=>c.status==='Cancelada'?'Cancelada':c.pgto?'Paga':(c.vencimento<HOJE?'Vencida':'Aberta');
const liquido=c=>Math.max(0,r2(c.valor-(c.desconto||0)));
function encargos(c){if(cobStatus(c)!=='Vencida')return{multa:0,juros:0,dias:0};const f=DB.config.fin,dias=diffDias(c.vencimento,HOJE),b=liquido(c);return{multa:r2(b*f.multa/100),juros:r2(b*(f.jurosMes/100/30)*dias),dias}}
const valorAtual=c=>{const e=encargos(c);return r2(liquido(c)+e.multa+e.juros)};
const respDe=c=>DB.responsaveis.find(r=>r.id===c.resp)||DB.responsaveis.find(r=>r.filhos.includes(c.aluno))||null;
const nomeAluno=id=>A(id)?A(id).nome:'(aluno removido)';
const ST_CLS={Aberta:'info',Vencida:'bad',Paga:'ok',Cancelada:'muted'};
const bancoOk=()=>{const f=DB.config.fin;return digs(f.banco).length>0&&digs(f.agencia).length>0&&digs(f.conta).length>0&&digs(f.carteira).length>0};
const mod10=x=>{let sum=0,w=2;for(let i=x.length-1;i>=0;i--){let q=(+x[i])*w;if(q>9)q=Math.floor(q/10)+q%10;sum+=q;w=w===2?1:2}return (10-sum%10)%10};
const mod11=x=>{let sum=0,w=2;for(let i=x.length-1;i>=0;i--){sum+=(+x[i])*w;w=w===9?2:w+1}const r=11-sum%11;return (r===0||r===10||r===11)?1:r};
function fatorVenc(d){const dt=parse(d),base=parse('2025-02-22');const f=dt>=base?1000+Math.round((dt-base)/864e5):Math.round((dt-parse('1997-10-07'))/864e5);return String(f%10000).padStart(4,'0')}
function boletoDados(c){const f=DB.config.fin,banco=digs(f.banco).padStart(3,'0').slice(-3),nosso=String(c.boleto.nosso).padStart(11,'0');
  const livre=digs(f.agencia).padStart(4,'0').slice(-4)+digs(f.conta).padStart(7,'0').slice(-7)+digs(f.carteira).padStart(2,'0').slice(-2)+nosso+'0';
  const valor=String(Math.round(liquido(c)*100)).padStart(10,'0'),fator=fatorVenc(c.vencimento),sem=banco+'9'+fator+valor+livre,dv=mod11(sem),cod=sem.slice(0,4)+dv+sem.slice(4);
  const c1=banco+'9'+livre.slice(0,5),c2=livre.slice(5,15),c3=livre.slice(15,25),l1=c1+mod10(c1),l2=c2+mod10(c2),l3=c3+mod10(c3);
  const linha=l1.slice(0,5)+'.'+l1.slice(5)+' '+l2.slice(0,5)+'.'+l2.slice(5)+' '+l3.slice(0,5)+'.'+l3.slice(5)+' '+dv+' '+fator+valor;
  return{banco,cod,linha,nosso}}
const ITF=['nnwwn','wnnnw','nwnnw','wwnnn','nnwnw','wnwnn','nwwnn','nnnww','wnnwn','nwnwn'];
function barcodeSVG(code){let x=0,r='';const bar=(w,d)=>{if(d)r+=`<rect x="${x}" y="0" width="${w}" height="50" fill="#000"/>`;x+=w};
  [1,1,1,1].forEach((w,i)=>bar(w,i%2===0));
  for(let i=0;i<code.length;i+=2){const a=ITF[+code[i]],b=ITF[+code[i+1]];for(let k=0;k<5;k++){bar(a[k]==='w'?3:1,true);bar(b[k]==='w'?3:1,false)}}
  bar(3,true);bar(1,false);bar(1,true);
  return `<svg viewBox="0 0 ${x} 50" preserveAspectRatio="none" style="width:100%;max-width:420px;height:50px" role="img" aria-label="Código de barras">${r}</svg>`}
function boletoHTML(c){
  const f=DB.config.fin,a=A(c.aluno),r=respDe(c),d=boletoDados(c),benef=f.beneficiario||DB.config.cabecalho.razao,e=encargos(c),liq=liquido(c),total=r2(liq+e.multa+e.juros);

  <div class="bl-grid">${bx(9,'Beneficiário',esc(benef)+(f.cnpj?' — CNPJ '+esc(f.cnpj):''))}${bx(3,'Vencimento','<b>'+fmt(c.vencimento)+'</b>','r')}${bx(9,'Pagador',esc(r?r.nome:'—')+' — aluno(a): '+esc(a?a.nome:''))}${bx(3,'Valor do documento','<b>'+brl(liq)+'</b>','r')}${bx(6,'Agência / Conta',ag)}${bx(6,'Nosso número',d.nosso)}</div>
  <div class="bl-cut">Corte aqui</div>${top}
  <div class="bl-grid">${bx(9,'Local de pagamento',esc(f.local||''))}${bx(3,'Vencimento','<b>'+fmt(c.vencimento)+'</b>','r')}
  ${bx(9,'Beneficiário',esc(benef)+(f.cnpj?' — CNPJ '+esc(f.cnpj):'')+'<br>'+esc(DB.config.cabecalho.linhas[0]||''))}${bx(3,'Agência / Código do beneficiário',ag,'r')}
  ${bx(2,'Data do documento',fmt(c.criado||HOJE))}${bx(2,'Nº do documento',String(c.num||'').padStart(6,'0'))}${bx(2,'Espécie doc.','DM')}${bx(1,'Aceite','N')}${bx(2,'Data do processamento',fmt(c.boleto.gerado))}${bx(3,'Nosso número',d.nosso,'r')}
  ${bx(2,'Carteira',esc(digs(f.carteira)))}${bx(2,'Espécie','R$')}${bx(2,'Quantidade','')}${bx(3,'(x) Valor','')}${bx(3,'(=) Valor do documento','<b>'+brl(liq)+'</b>','r')}
  <div class="bx" style="grid-column:span 9;grid-row:span 4"><small>Instruções (texto de responsabilidade do beneficiário)</small>${esc(instr)}</div>${bx(3,'(-) Desconto / Abatimento',c.desconto?brl(c.desconto):'','r')}${bx(3,'(+) Mora / Multa',e.multa+e.juros?brl(e.multa+e.juros):'','r')}${bx(3,'(+) Outros acréscimos','','r')}${bx(3,'(=) Valor cobrado','<b>'+brl(total)+'</b>','r')}
  ${bx(12,'Pagador',pagador)}${bx(12,'Sacador / Avalista','')}</div>
  <div class="bl-bar">${barcodeSVG(d.cod)}</div>

function parseEtapa(x){const v=imN(x);if(!v)return '';if(/fundamentalii|fundamental2|fund2|^f2$|fundii|6ao9|anosfinais/.test(v))return 'fund2';if(/fundamentali|fundamental1|fund1|^f1$|fundi|1ao5|anosiniciais/.test(v))return 'fund1';if(/medio|^em$/.test(v))return 'medio';if(/outro|infantil/.test(v))return 'outro';return ''}
function matchSerie(e,x){if(e==='outro')return String(x).trim();const n=(String(x).match(/\d+/)||[])[0];if(!n)return '';return (SERIES[e]||[]).find(s=>s.startsWith(n))||''}
function parseTurno(x){const v=imN(x);return /^manha/.test(v)?'Manhã':/^tarde/.test(v)?'Tarde':/^noite/.test(v)?'Noite':/^integral/.test(v)?'Integral':''}
function parseCSV(txt){txt=String(txt).replace(/^\uFEFF/,'');const l1=txt.split(/\r?\n/)[0]||'',cnt=c=>l1.split(c).length-1,dl=cnt(';')>=cnt(',')&&cnt(';')>=cnt('\t')?';':(cnt('\t')>cnt(',')?'\t':',');
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows}
function carregarXLSX(){return new Promise((ok,err)=>{if(window.XLSX)return ok();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>ok();sc.onerror=()=>err(new Error('xlsx'));document.head.appendChild(sc)})}
async function lerPlanilha(f){const nm=f.name.toLowerCase();
  if(/\.(xlsx|xls|xlsm|ods)$/.test(nm)){await carregarXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'dd/mm/yyyy',defval:''})}
  let t=await f.text();if(t.includes('\uFFFD'))t=new TextDecoder('windows-1252').decode(await f.arrayBuffer());return parseCSV(t)}
const okData=(y,m,d)=>{const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d&&y>=1940&&y<=new Date().getFullYear()?y+'-'+pad(m)+'-'+pad(d):''};
function parseData(v){v=String(v||'').trim();if(!v)return '';let m;
  if(m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=y>30?1900:2000;return okData(y,mo,d)}
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return okData(+m[1],+m[2],+m[3]);
  if(/^\d{4,6}$/.test(v)){const n=+v;if(n>15000&&n<80000){const dt=new Date(Date.UTC(1899,11,30)+n*864e5);return okData(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}}
  return ''}
function parseSeg(x){const v=imN(x);if(!v||/^(todas|todos|geral)/.test(v))return 'todos';if(/^(fund1|fundamentali|fundamental1|f1|fundi)$/.test(v))return 'fund1';if(/^(fund2|fundamentalii|fundamental2|f2|fundii)$/.test(v))return 'fund2';if(/^(medio|ensinomedio|em)$/.test(v))return 'medio';return null}
function impLinhas(tipo,raw){const def=IMP[tipo],h=(raw[0]||[]).map(imN),idx={},falt=[];
  def.cols.forEach(c=>{const i=h.findIndex(x=>c[2].includes(x));if(i>=0)idx[c[0]]=i});
  def.obrig.forEach(k=>{if(idx[k]===undefined)falt.push(def.cols.find(c=>c[0]===k)[1])});
  if(falt.length)return{falt,linhas:[]};const linhas=[];
  raw.slice(1).forEach((r,i)=>{if(!r||r.every(c=>String(c==null?'':c).trim()===''))return;const d={};Object.keys(idx).forEach(k=>d[k]=String(r[idx[k]]==null?'':r[idx[k]]).trim());
    def.cols.forEach(c=>{if(d[c[0]]===undefined)d[c[0]]=''});if(String(d.nome||'').toLowerCase().startsWith('(exemplo)'))return;linhas.push({n:i+2,d,erros:[]})});
  return{falt:[],linhas}}
function impValidar(){const I=S.imp,r=impLinhas(I.tipo,I.raw);I.falt=r.falt;I.linhas=r.linhas;const seen=new Set(),cap={};
  I.linhas.forEach(L=>{const d=L.d,E=L.erros,k=imN(d.nome);
    if(I.tipo==='alunos'){
      if(d.nome.length<3)E.push('Nome do aluno inválido');d.nascISO=parseData(d.nasc);if(!d.nascISO)E.push('Data de nascimento inválida (use dd/mm/aaaa)');
      let tid=I.turma;if(d.turma){const t=DB.turmas.find(x=>imN(x.nome)===imN(d.turma));if(t)tid=t.id;else E.push('Turma "'+d.turma+'" não encontrada')}d.tid=tid;if(!tid||!T(tid))E.push('Escolha a turma');
      if(d.respNome.length<2)E.push('Nome do responsável ausente');if(digs(d.respTel).length<8)E.push('Telefone do responsável inválido');
      if(d.cpf&&!cpfOk(d.cpf))E.push('CPF do aluno inválido');if(d.respCpf&&!cpfOk(d.respCpf))E.push('CPF do responsável inválido');if(!emailOk(d.respEmail))E.push('E-mail do responsável inválido');
      const kk=k+'|'+d.nascISO;if(seen.has(kk))E.push('Repetido na planilha');seen.add(kk);
      if(DB.alunos.some(a=>imN(a.nome)===k&&a.nasc===d.nascISO))E.push('Aluno já cadastrado');if(d.cpf&&DB.alunos.some(a=>a.cpf===fmtCpf(d.cpf)))E.push('CPF do aluno já cadastrado');
      const t=T(tid);if(t&&t.capacidade>0&&!E.length){cap[tid]=(cap[tid]||0)+1;if(alunosDe(tid).length+cap[tid]>t.capacidade)E.push('Turma '+t.nome+' lotada')}}
    else if(I.tipo==='turmas'){
      if(d.nome.length<2)E.push('Nome da turma inválido');
      d.etapaISO=parseEtapa(d.etapa);if(!d.etapaISO)E.push('Curso / etapa inválido (Fundamental I, Fundamental II, Ensino Médio ou Outro)');
      d.serieISO='';if(d.serie&&d.etapaISO){d.serieISO=matchSerie(d.etapaISO,d.serie);if(!d.serieISO)E.push('Série "'+d.serie+'" não existe nesta etapa')}

      d.capNum=0;if(d.cap){const n=parseInt(d.cap,10);if(isNaN(n)||n<0)E.push('Vagas inválidas');else d.capNum=n}
      d.menNum=money(d.men);
      if(seen.has(k))E.push('Repetida na planilha');seen.add(k);if(DB.turmas.some(t=>imN(t.nome)===k))E.push('Turma já cadastrada')}
    else if(I.tipo==='prof'){
      if(d.nome.length<3)E.push('Nome inválido');if(digs(d.tel).length<8)E.push('Telefone inválido');if(!d.email||!emailOk(d.email))E.push('E-mail inválido');
      const ds=d.disc.split(/[;,\/|]+/).map(x=>x.trim()).filter(Boolean),ok=[],bad=[];ds.forEach(x=>{const m=DISC.find(y=>imN(y)===imN(x));m?ok.push(m):bad.push(x)});if(!ds.length)E.push('Informe as disciplinas');if(bad.length)E.push('Disciplina não cadastrada: '+bad.join(', '));d.discs=ok;
      d.nascISO=d.nasc?parseData(d.nasc):'';if(d.nasc&&!d.nascISO)E.push('Data de nascimento inválida');if(d.cpf&&!cpfOk(d.cpf))E.push('CPF inválido');
      if(seen.has(k))E.push('Repetido na planilha');seen.add(k);if(DB.professores.some(p=>imN(p.nome)===k||(d.cpf&&p.cpf===fmtCpf(d.cpf))))E.push('Professor já cadastrado')}
    else if(I.tipo==='coord'){
      if(d.nome.length<3)E.push('Nome inválido');if(!d.email||!emailOk(d.email))E.push('E-mail inválido');d.segISO=parseSeg(d.seg);if(d.segISO===null)E.push('Coordenação inválida (Fundamental I, Fundamental II, Ensino Médio ou Todas)');

    else{

      const mats=(d.alunos||'').split(/[;,|]+/).map(x=>x.trim()).filter(Boolean),fl=[],bad=[];mats.forEach(m=>{const a=DB.alunos.find(x=>x.matricula===m);a?fl.push(a.id):bad.push(m)});if(bad.length)E.push('Matrícula não encontrada: '+bad.join(', '));d.filhos=fl;

function proxSerie(e,sr){const i=SEQ_SERIES.findIndex(x=>x[0]===e&&x[1]===sr);if(i<0)return null;return i+1<SEQ_SERIES.length?{etapa:SEQ_SERIES[i+1][0],serie:SEQ_SERIES[i+1][1]}:'fim'}

const viradaSig=()=>DB.turmas.map(t=>t.id+'|'+t.nome+'|'+t.serie).join(',')+'#'+DB.alunos.length+'#'+DB.config.ano;

    alunosDe(t.id).forEach(a=>{res[a.id]=resultadoSugerido(a)})});

function fechamentosPendentes(){const set=new Set();Object.keys(DB.horario).forEach(k=>{const p=k.split('|');if(DB.turmas.some(t=>t.id===p[0]))set.add(p[0]+'|'+DB.horario[k].disc)});let n=0;set.forEach(x=>{[1,2,3].forEach(tr=>{if(!DB.fechamentos[x+'|'+tr])n++})});return n}
function destRepetente(tid){const V=S.vd,t=DB.turmas.find(x=>x.id===tid);for(const u of DB.turmas){if(u.id===tid)continue;const p=V.planos[u.id];if(!p||p.acao==='encerrar')continue;if(p.etapa===t.etapa&&p.serie===t.serie&&u.turno===t.turno)return u}return null}

function viradaAplicar(){const V=S.vd,ano=DB.config.ano,novo=V.ano,idsOld=DB.turmas.map(t=>t.id),tinfo={};
  DB.turmas.forEach(t=>{tinfo[t.id]={old:Object.assign({},t),alunos:alunosDe(t.id)}});
  /* 1. histórico do ano que termina (antes de apagar qualquer dado) */
  idsOld.forEach(tid=>{const t=DB.turmas.find(x=>x.id===tid),p=V.planos[tid];tinfo[tid].alunos.forEach(a=>{const rs=V.res[a.id]||'Aprovado',lbl=rs==='Aprovado'&&p.acao==='encerrar'?'Concluído':rs,reg=registroAno(a,t,lbl),l=(DB.historicoAnt[a.id]=DB.historicoAnt[a.id]||[]),i=l.findIndex(h=>h.ano===ano);if(i>=0)l[i]=Object.assign({},l[i],reg,{id:l[i].id});else l.push(reg)})});
  /* 2. destino dos repetentes (cria turma quando não existe uma da mesma série) */
  const dest={},usados=new Set(DB.turmas.filter(t=>V.planos[t.id].acao!=='encerrar').map(t=>imN(V.planos[t.id].nome)));let novas=0;
  idsOld.forEach(tid=>{const reps=tinfo[tid].alunos.filter(a=>V.res[a.id]==='Reprovado');if(!reps.length)return;const p=V.planos[tid],old=tinfo[tid].old;
    if(p.acao==='manter'){dest[tid]=tid;return}const u=destRepetente(tid);if(u){dest[tid]=u.id;return}
    let nome=old.nome;if(usados.has(imN(nome)))nome=old.nome+' (repetentes)';usados.add(imN(nome));
    const nt={id:nid('t'),nome,etapa:old.etapa||'',serie:old.serie||'',turno:old.turno||'Manhã',ano:novo,sala:old.sala||'',capacidade:old.capacidade||0,mensalidade:r2((old.mensalidade||0)*(1+V.reaj/100)),regente:'',obs:'Turma criada na migração para os alunos que repetem a série.'};
    DB.turmas.push(nt);dest[tid]=nt.id;novas++});
  /* 3. turmas existentes passam para o novo ano */
  DB.turmas.forEach(t=>{const p=V.planos[t.id];if(!p||p.acao==='encerrar')return;t.nome=p.nome.trim();t.etapa=p.etapa;t.serie=p.serie;t.ano=novo;if(t.mensalidade)t.mensalidade=r2(t.mensalidade*(1+V.reaj/100))});
  /* 4. alunos */
  const alIds=new Set();idsOld.forEach(tid=>{const p=V.planos[tid];tinfo[tid].alunos.forEach(a=>{alIds.add(a.id);const x=V.res[a.id]||'Aprovado';
    if(x==='Aprovado'){if(p.acao==='encerrar')a.situacao='Concluído'}else if(x==='Reprovado')a.turma=dest[tid]||tid;else a.situacao=x})});
  /* 5. recomeça o ano: avaliações, notas, chamadas e aulas */
  const set=new Set(idsOld),avIds=new Set(DB.avaliacoes.filter(v=>set.has(v.turma)).map(v=>v.id));
  DB.avaliacoes=DB.avaliacoes.filter(v=>!set.has(v.turma));Object.keys(DB.notas).forEach(k=>{if(avIds.has(k.split('|')[0]))delete DB.notas[k]});
  Object.keys(DB.recuperacao).forEach(k=>{if(alIds.has(k.split('|')[0]))delete DB.recuperacao[k]});
  Object.keys(DB.chamada).forEach(k=>{if(set.has(k.split('|')[0]))delete DB.chamada[k]});
  Object.keys(DB.justificativas).forEach(k=>{if(alIds.has(k.split('|')[0]))delete DB.justificativas[k]});
  Object.keys(DB.fechamentos).forEach(k=>{if(set.has(k.split('|')[0]))delete DB.fechamentos[k]});
  DB.aulas=DB.aulas.filter(a=>!set.has(a.turma));DB.eventos=DB.eventos.filter(e=>!(e.avalId&&avIds.has(e.avalId)));

  DB.turmasArq=DB.turmasArq||[];DB.turmas=DB.turmas.filter(t=>{const p=V.planos[t.id];if(p&&p.acao==='encerrar'){t.arquivada=true;t.anoEncerrado=ano;DB.turmasArq.push(t);Object.keys(DB.horario).forEach(k=>{if(k.startsWith(t.id+'|'))delete DB.horario[k]});DB.materiais=DB.materiais.filter(m=>m.turma!==t.id);return false}return true});

  DB.config.ano=novo;DB.config.trimestres.forEach(t=>{t.ini=(+t.ini.slice(0,4)+1)+t.ini.slice(4);t.fim=(+t.fim.slice(0,4)+1)+t.fim.slice(4)});

    else if(k==='turma'){DB.turmas=DB.turmas.filter(t=>t.id!==id);Object.keys(DB.horario).forEach(x=>{if(x.startsWith(id+'|'))delete DB.horario[x]});
      const ids=new Set(DB.avaliacoes.filter(v=>v.turma===id).map(v=>v.id));DB.avaliacoes=DB.avaliacoes.filter(v=>v.turma!==id);Object.keys(DB.notas).forEach(x=>{if(ids.has(x.split('|')[0]))delete DB.notas[x]});
      Object.keys(DB.chamada).forEach(x=>{if(x.startsWith(id+'|'))delete DB.chamada[x]});DB.aulas=DB.aulas.filter(a=>a.turma!==id);DB.materiais=DB.materiais.filter(m=>m.turma!==id);DB.eventos=DB.eventos.filter(e=>e.turma!==id);DB.comunicados=DB.comunicados.filter(c=>c.dest!==id)}
    else if(k==='prof'){DB.professores=DB.professores.filter(p=>p.id!==id);rmUsers(u=>u.funcao==='professor'&&u.ref===id)}
    else if(k==='resp'){DB.comunicados=DB.comunicados.filter(c=>c.dest!=='r:'+id);DB.alunos.forEach(a=>{if(a.respFin===id)a.respFin=''});DB.cobrancas.forEach(c=>{if(c.resp===id)c.resp=''});DB.responsaveis=DB.responsaveis.filter(r=>r.id!==id);rmUsers(u=>u.funcao==='pais'&&u.ref===id)}
    else if(k==='user'){if(id===S.user.id)return;rmUsers(u=>u.id===id)}
    S.f={};save();closeModal();toast('Excluído');render()},
  delDisc(el){const d=el.dataset.d,c=DB.config;
    if(DB.avaliacoes.some(v=>v.disc===d)||Object.values(DB.horario).some(h=>h.disc===d)||DB.professores.some(p=>p.disc.includes(d))){modal(mhead('Não é possível remover')+`<p>A disciplina ${esc(d)} está em uso (professor, quadro de horários ou avaliações). Retire esses vínculos antes.</p><div class="row"><button class="btn" data-act="fechar">Entendi</button></div>`);return}
    c.disciplinas=c.disciplinas.filter(x=>x!==d);DISC=c.disciplinas;save();toast('Disciplina removida');render()},
  gerarDecl(){const aid=val('dc-aluno'),tipo=S.f.dtipo||TIPOS_DECL[0];if(!aid||!A(aid)){toast('Escolha o aluno');return}
    const ex=tipo==='Declaração de comparecimento'?{quem:val('dc-quem'),data:val('dc-data')||HOJE,ini:val('dc-ini'),fim:val('dc-fim'),motivo:val('dc-mot').trim()}:{};
    DB.seqDoc=(DB.seqDoc||0)+1;const e={id:nid('x'),aluno:aid,tipo,extra:ex,numero:DB.seqDoc,date:HOJE,por:S.user.nome};DB.emitidos.push(e);save();
    modal(mhead(tipo)+declaracaoHTML(aid,tipo,ex,e.numero)+`<div class="row noprint" style="margin-top:14px"><button class="btn" data-act="imprimir">Imprimir</button></div>`,true);render()},
  reabrirDecl(el){const e=DB.emitidos.find(x=>x.id===el.dataset.id);if(!e)return;modal(mhead(e.tipo)+declaracaoHTML(e.aluno,e.tipo,e.extra,e.numero)+`<div class="row noprint" style="margin-top:14px"><button class="btn" data-act="imprimir">Imprimir</button></div>`,true)},

  novoUsuario(){modal(mhead('Novo usuário')+`<div class="fgrid"><label class="f">Função${sel('id="nu-f" data-chg="ufunc"',Object.keys(FUNCOES).map(f=>[f,FUNCOES[f]]),'professor')}</label><div id="uv">${vinculoHTML('professor')}</div><div class="grid g2"><label class="f">Nome de usuário (login)<input id="nu-l" autocapitalize="none" placeholder="Em branco: gerado pelo nome"></label><label class="f">Senha inicial<input id="nu-s" value="${gerarSenha()}"></label></div><p class="err" id="nu-err"></p><div><button class="btn" data-act="salvarUsuario">Criar usuário</button></div></div>`)},
  async salvarUsuario(){const f=val('nu-f'),s=val('nu-s'),e=$('#nu-err');let l=val('nu-l').trim().toLowerCase(),nome,ref,email='',seg;
    if(f==='secretaria'||f==='gestao'||f==='financeiro'){nome=val('nu-nome').trim();if(!nome){e.textContent='Informe o nome completo.';return}ref=null;email=val('nu-em').trim();if(!emailOk(email)){e.textContent='E-mail inválido.';return}if(f==='gestao')seg=val('nu-seg')||'todos'}
    else{ref=val('nu-ref');if(!ref){e.textContent='Não há cadastro disponível para vincular.';return}nome=f==='professor'?PR(ref).nome:f==='aluno'?A(ref).nome:DB.responsaveis.find(r=>r.id===ref).nome}
    if(!l)l=loginDe(nome);
    if(!loginOk(l)){e.textContent='Use no mínimo 3 caracteres: letras minúsculas sem acento, números, ponto, hífen ou sublinhado.';return}
    if(DB.usuarios.some(u=>u.login===l)){e.textContent='Esse nome de usuário já existe.';return}
    if(s.length<6){e.textContent='A senha inicial precisa ter pelo menos 6 caracteres.';return}
    const id=nid('u'),u=await addUser(nome,f,ref||id,l,s,Object.assign({id},email?{email}:{},seg?{segmento:seg}:{}));save();closeModal();render();acessoModal([itemAcesso(u,s)],'Usuário criado')},
  redefSenha(el){const u=DB.usuarios.find(x=>x.id===el.dataset.id);modal(mhead('Redefinir senha')+`<div class="fgrid"><p style="margin:0">Nova senha para <b>${esc(u.nome)}</b> (<code>${esc(u.login)}</code>).</p><label class="f">Nova senha<input id="rs-s" value="${gerarSenha()}"></label><p class="err" id="rs-err"></p><div><button class="btn" data-act="salvarRedef" data-id="${u.id}">Salvar senha</button></div></div>`)},
  async salvarRedef(el){const s=val('rs-s');if(s.length<6){$('#rs-err').textContent='A senha precisa ter pelo menos 6 caracteres.';return}const u=DB.usuarios.find(x=>x.id===el.dataset.id);u.hash=await sha(s);save();closeModal();acessoModal([itemAcesso(u,s)],'Senha redefinida')},
  toggleUser(el){const u=DB.usuarios.find(x=>x.id===el.dataset.id);if(u.id===S.user.id)return;u.ativo=!u.ativo;save();toast(u.ativo?'Usuário ativado':'Usuário desativado');render()},
  novoProf(){modal(mhead('Novo professor')+profForm(null),true)},
  editarProf(el){modal(mhead('Editar professor')+profForm(PR(el.dataset.id)),true)},
  async salvarProf(el){const id=el.dataset.id,nome=val('pf-n').trim(),ds=[...document.querySelectorAll('.pf-d')].filter(x=>x.checked).map(x=>x.value);
    const d=Object.assign({nome,cpf:fmtCpf(val('pf-cpf')),rg:val('pf-rg').trim(),nasc:val('pf-nasc'),telefone:val('pf-t').trim(),email:val('pf-e').trim(),formacao:val('pf-form').trim(),registro:val('pf-reg').trim(),vinculo:val('pf-vin'),admissao:val('pf-adm'),cargaHoraria:+val('pf-ch')||0,disc:ds},endRead('pf'));
    if(!nome||!ds.length){toast('Informe o nome e ao menos uma disciplina');return}if(!d.telefone){toast('Informe o telefone');return}if(!d.email||!emailOk(d.email)){toast('Informe um e-mail válido');return}
    if(d.cpf&&!cpfOk(d.cpf)){toast('CPF inválido');return}if(d.cpf&&DB.professores.some(x=>x.id!==id&&x.cpf===d.cpf)){toast('Já existe um professor com esse CPF');return}
    const cb=$('#pf-u'),quer=!!(cb&&cb.checked);let l=val('pf-l').trim().toLowerCase();
    if(quer&&l){if(!loginOk(l)){toast('Usuário inválido: use letras minúsculas sem acento, números, ponto ou hífen');return}if(DB.usuarios.some(u=>u.login===l)){toast('Esse usuário já existe');return}}
    if(id&&Object.values(DB.horario).some(c=>c.prof===id&&!ds.includes(c.disc))){toast('Há horários dele(a) em disciplina que você desmarcou. Ajuste o quadro antes.');return}
    let p;if(id){p=PR(id);Object.assign(p,d);DB.usuarios.forEach(u=>{if(u.funcao==='professor'&&u.ref===id)u.nome=nome})}else{p=Object.assign({id:nid('p')},d);DB.professores.push(p)}
    let lista=[];if(quer&&!DB.usuarios.some(u=>u.funcao==='professor'&&u.ref===p.id)){const sn=gerarSenha(),u=await addUser(nome,'professor',p.id,l||loginDe(nome),sn);lista.push(itemAcesso(u,sn))}
    save();closeModal();render();if(lista.length)acessoModal(lista,'Professor cadastrado');else toast('Professor salvo')},
  salvarConfig(){const c=DB.config;c.escola=val('cf-esc').trim()||c.escola;c.ano=+val('cf-ano')||c.ano;c.urlSistema=val('cf-url').trim();c.msgBoasVindas=val('cf-msg')||MSG_PADRAO;c.cabecalho={razao:val('cf-rz').trim()||c.cabecalho.razao,linhas:val('cf-cb').split('\n').map(x=>x.trim()).filter(Boolean)};
    c.trimestres.forEach(t=>{t.ini=val('cf-i'+t.n)||t.ini;t.fim=val('cf-f'+t.n)||t.fim});
    c.notaMinTri=Math.max(0,Math.min(100,+val('cf-mt')||0));c.notaMinAnual=Math.max(0,Math.min(300,+val('cf-ma')||c.notaMinAnual));c.freqMin=Math.max(0,Math.min(100,+val('cf-fq')||0));
    c.tempos=c.tempos.map((h,i)=>val('cf-h'+i)||h);
    const nd=val('cf-nd').trim();if(nd&&!c.disciplinas.includes(nd)){c.disciplinas.push(nd);DISC=c.disciplinas}
    save();toast('Configurações salvas');render()}
};
function profForm(p){const n=p||{};
  return `<div class="fgrid">${secH('Dados pessoais')}<div class="grid g3">${fld('pf-n','Nome completo *',n.nome)}${fld('pf-cpf','CPF',n.cpf,'inputmode="numeric"')}${fld('pf-rg','RG',n.rg)}<label class="f">Data de nascimento<input type="date" id="pf-nasc" value="${esc(n.nasc||'')}"></label></div>
  ${secH('Contato')}<div class="grid g3">${fld('pf-t','Telefone *',n.telefone)}${fld('pf-e','E-mail *',n.email,'type="email"')}</div>
  ${secH('Endereço')}${endForm('pf',n)}
  ${secH('Formação e vínculo')}<div class="grid g3">${fld('pf-form','Formação (graduação e pós)',n.formacao)}${fld('pf-reg','Registro profissional',n.registro)}<label class="f">Vínculo${sel('id="pf-vin"',VINCULOS.map(x=>[x,x||'Selecione']),n.vinculo||'')}</label><label class="f">Data de admissão<input type="date" id="pf-adm" value="${esc(n.admissao||'')}"></label>${fld('pf-ch','Carga horária semanal (h)',n.cargaHoraria,'type="number" min="0"')}</div>
  ${secH('Disciplinas *')}<div class="checks">${DISC.map(d=>`<label><input type="checkbox" class="pf-d" value="${esc(d)}"${p&&p.disc.includes(d)?' checked':''}> ${esc(d)}</label>`).join('')}</div>
  ${acessoCampos('pf',p&&DB.usuarios.some(u=>u.funcao==='professor'&&u.ref===p.id))}
  <div class="row"><button class="btn" data-act="salvarProf"${p?` data-id="${p.id}"`:''}>Salvar professor</button>${p?`<button class="btn danger" data-act="pedirExcluir" data-k="prof" data-id="${p.id}">Excluir</button>`:''}</div></div>`}
function turmaForm(t){const n=t||{};
  return `<div class="fgrid"><div class="grid g2">${fld('nt-n','Nome da turma *',n.nome,'placeholder="Ex.: 6º ano A"')}<label class="f">Curso / etapa *${sel('id="nt-e" data-chg="etapa"',ETAPAS,n.etapa||'')}</label><label class="f">Série / ano${sel('id="nt-s"',serieOpts(n.etapa||''),n.serie||'')}</label><label class="f">Turno${sel('id="nt-t"',['Manhã','Tarde','Noite','Integral'].map(x=>[x,x]),n.turno||'Manhã')}</label>${fld('nt-a','Ano letivo',n.ano||DB.config.ano,'type="number"')}${fld('nt-sala','Sala',n.sala)}<label class="f">Número máximo de alunos<input type="number" id="nt-cap" min="0" value="${n.capacidade||''}" placeholder="Sem limite"></label>${fld('nt-men','Mensalidade padrão (R$)',n.mensalidade?String(n.mensalidade).replace('.',','):'','inputmode="decimal"')}<label class="f">Professor responsável (conselheiro)${sel('id="nt-reg"',[['','Nenhum'],...DB.professores.map(p=>[p.id,p.nome])],n.regente||'')}</label></div>
  <label class="f">Observações<textarea id="nt-obs">${esc(n.obs||'')}</textarea></label>
  <div class="row"><button class="btn" data-act="salvarTurma"${t?` data-id="${t.id}"`:''}>${t?'Salvar alterações':'Criar turma'}</button>${t?`<button class="btn danger" data-act="pedirExcluir" data-k="turma" data-id="${t.id}">Excluir turma</button>`:''}</div></div>`}

const CHG={
  permperfil(el){setPerfil(el.dataset.r,el.dataset.f,el.checked);toast('Função '+(el.checked?'disponibilizada':'retirada')+' para o perfil');render()},
  etapa(el){const o=serieOpts(el.value);$('#nt-s').innerHTML=o.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')},
  logo(el){const f=el.files&&el.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Escolha um arquivo de imagem');return}
    const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);DB.config.logo=cv.toDataURL('image/jpeg',.9);save();render();toast('Logo atualizada')};im.onerror=()=>toast('Não foi possível ler a imagem');im.src=rd.result};rd.readAsDataURL(f)},
  irmao(el){const id=el.value;if(!id)return;const r=DB.responsaveis.find(x=>x.filhos.includes(id));if(r){const s2=$('#na-rs');if(s2)s2.value=r.id;toast('Responsável selecionado: '+r.nome)}else toast('Esse aluno ainda não tem responsável vinculado.')},
  async impfile(el){const f=el.files&&el.files[0];if(!f||!S.imp)return;if(f.size>5*1024*1024){toast('Arquivo muito grande (máximo 5 MB).');return}
    toast('Lendo a planilha...');try{S.imp.raw=await lerPlanilha(f);S.imp.nome=f.name;impValidar();modal(impHTML(),true)}catch(e){toast('Não foi possível ler o arquivo. Se for Excel, tente salvar como CSV.')}},
  impopt(el){if(!S.imp)return;const t=$('#im-t'),u=$('#im-u');if(t)S.imp.turma=t.value;if(u)S.imp.criar=!!u.checked;if(S.imp.raw)impValidar();modal(impHTML(),true)},
  vdp(el){const t=T(el.dataset.t),p=S.vd&&S.vd.planos[el.dataset.t],k=el.dataset.k;if(!p)return;
    if(k==='acao'){p.acao=el.value;if(p.acao==='manter'){p.nome=t.nome;p.etapa=t.etapa||'';p.serie=t.serie||''}else if(p.acao==='promover'){const nx=proxSerie(t.etapa,t.serie);if(nx&&nx!=='fim'){p.etapa=nx.etapa;p.serie=nx.serie;p.nome=nomeSugerido(t,nx.serie)}}render();return}
    p[k]=el.value;if(k==='etapa')p.serie='';if(k!=='nome')render()},
  vdr(el){if(S.vd)S.vd.res[el.dataset.a]=el.value},
  vdc(el){if(!S.vd)return;if(el.dataset.k==='ciente')S.vd.ciente=!!el.checked;else{S.vd.reaj=Math.max(0,money(el.value))}},
  ufunc(el){$('#uv').innerHTML=vinculoHTML(el.value)},
  f(el){const k=el.dataset.k;S.f[k]=(k==='tri'||k==='gtri'||k==='ftri')?+el.value:el.value;if(k==='turma'){delete S.f.aula;delete S.f.cdata;delete S.f.ctempo}if(k==='hturma')delete S.f.haluno;if(k==='dturma')delete S.f.daluno;S.draft=null;S.nd={};render()},
  octurma2(el){S.f.nturma=el.value;$('#oc-a').innerHTML=alunosDe(el.value).map(a=>`<option value="${esc(a.id)}">${esc(a.nome)}</option>`).join('')},
  hcell(el){const t=el.dataset.t,dia=+el.dataset.d,k=+el.dataset.k,key=t+'|'+dia+'|'+k;
    if(!el.value){delete DB.horario[key]}else{const p=el.value.split('|'),pid=p[1];
      const conf=DB.turmas.find(x=>x.id!==t&&hcell(x.id,dia,k)&&hcell(x.id,dia,k).prof===pid);
      if(conf){toast(PR(pid).nome+' já está na turma '+conf.nome+' neste horário.');render();return}
      DB.horario[key]={disc:p[0],prof:pid}}
    save();toast('Horário atualizado')}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn)fn(el,e)});
document.addEventListener('submit',e=>{if(e.target.id==='lg-form'){e.preventDefault();ACT.entrar()}});
document.addEventListener('change',e=>{const c=e.target.dataset.chg;if(c&&CHG[c])CHG[c](e.target)});
document.addEventListener('input',e=>{
  const el=e.target,c=el.dataset.inp;
  if(c==='busca'){S.busca=el.value;$('#alBody').innerHTML=alunosRows()}
  if(c==='emailacesso'){const i=+el.dataset.i,a=$('#ml-'+i);if(a&&S.ac&&S.ac[i])a.setAttribute('href',mailtoHref(S.ac[i],el.value))}
  if(c==='nota'||c==='rec'){const v=el.value.trim().replace(',','.'),a=el.dataset.a,f=S.f;let key,max;
    if(c==='nota'){const av=DB.avaliacoes.find(x=>x.id===el.dataset.av);key=el.dataset.av+'|'+a;max=av.valor}else{key='rec:'+a+'|'+f.disc+'|'+f.tri;max=100}
    if(v==='')S.nd[key]=null;else{const x=parseFloat(v);if(isNaN(x))return;S.nd[key]=Math.max(0,Math.min(max,x))}
    const tot=avs(f.turma,f.disc,f.tri).reduce((s,x)=>{const n=S.nd[x.id+'|'+a]!==undefined?S.nd[x.id+'|'+a]:nota(x.id,a);return s+(num(n)?n:0)},0);
    const rk='rec:'+a+'|'+f.disc+'|'+f.tri,rv=S.nd[rk]!==undefined?S.nd[rk]:DB.recuperacao[a+'|'+f.disc+'|'+f.tri];
    $('#t-'+a).innerHTML='<b>'+fp(tot)+'</b>';$('#r-'+a).innerHTML='<b>'+fp(num(rv)?Math.max(tot,rv):tot)+'</b>'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

function recarregarDeOutraAba(raw){try{const n=JSON.parse(raw);if(!n||!n.alunos||!n.config)return;DB=n;migrar();DISC=DB.config.disciplinas;VER++;
  if(S.user){const u=DB.usuarios.find(x=>x.id===S.user.id&&x.ativo);if(!u){S.role=null;S.user=null}else S.user=u}
  const ae=document.activeElement;if($('#modal').hidden&&!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render()}catch(e){}}
if(window.addEventListener)window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)recarregarDeOutraAba(e.newValue)});
async function init(){load();await ensureHashes();restaurarSessao();render()}
init();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA:', err));
  });
}
</script>
